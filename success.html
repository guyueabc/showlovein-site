<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Showlovein</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .text-gold { color: #D4AF37; }
        .bg-gold { background-color: #D4AF37; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-xl p-10 text-center">
        <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-check text-4xl text-green-500"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-3">Thank You for Your Order!</h1>
        <p class="text-gray-600 mb-8">Your payment has been received successfully.</p>

        <div class="bg-pink-50 rounded-2xl p-6 mb-8 text-left">
            <p class="text-sm text-gray-500 mb-1">Order ID</p>
            <p class="text-lg font-mono font-bold text-gray-900 mb-4" id="order-id">—</p>
            <p class="text-sm text-gray-500 mb-1">Total Paid</p>
            <p class="text-2xl font-bold text-gold" id="order-total">—</p>
        </div>

        <p class="text-sm text-gray-600 mb-6">
            A confirmation email has been sent to <span id="order-email" class="font-semibold">your email</span>.<br>
            We will process and ship your order within 1-3 business days.
        </p>

        <div class="space-y-3">
            <a href="index.html" class="block w-full bg-gold text-white py-3 rounded-xl font-semibold hover:bg-yellow-600">Continue Shopping</a>
            <a href="https://wa.me/8615376427736" target="_blank" class="block w-full border border-green-500 text-green-500 py-3 rounded-xl font-semibold hover:bg-green-50">
                <i class="fab fa-whatsapp"></i> Track via WhatsApp
            </a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(location.search);
        const orderId = params.get('order');
        const lastOrder = JSON.parse(localStorage.getItem('lastOrder') || 'null');

        if (orderId) document.getElementById('order-id').textContent = orderId;
        if (lastOrder) {
            document.getElementById('order-total').textContent = '$' + lastOrder.total.toFixed(2);
            document.getElementById('order-email').textContent = lastOrder.shipping.email;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Showlovein</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .text-gold { color: #D4AF37; }
        .bg-gold { background-color: #D4AF37; }
    </style>
    <script src="products.js"></script>
</head>
<body class="bg-gray-50">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-white border-b border-pink-100">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-20 items-center">
                <a href="index.html" class="text-2xl font-bold tracking-tighter text-gray-900">SHOW<span class="text-gold">LOVEIN</span></a>
                <div class="flex items-center gap-4">
                    <a href="login.html" id="login-link" class="text-gray-600 hover:text-gold flex items-center gap-2 text-sm"><i class="fas fa-user"></i><span class="hidden md:inline">Sign In</span></a>
                    <div id="user-menu" style="display:none" class="items-center gap-2">
                        <span class="text-sm text-gray-700"><i class="fas fa-user-circle text-gold"></i> <span id="user-name"></span></span>
                        <button onclick="Auth.logout()" class="text-xs text-gray-400 hover:text-red-500">Logout</button>
                    </div>
                    <a href="cart.html" class="relative text-gold">
                        <i class="fas fa-shopping-bag text-xl"></i>
                        <span id="cart-badge" class="absolute -top-2 -right-2 bg-gold text-white text-xs w-5 h-5 rounded-full flex items-center justify-center" style="display:none">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-28 pb-20">
        <div class="max-w-6xl mx-auto px-4">
            <h1 class="text-3xl font-bold text-gray-900 mb-8">Shopping Cart</h1>

            <div id="cart-empty" class="hidden text-center py-20 bg-white rounded-2xl">
                <i class="fas fa-shopping-bag text-6xl text-gray-300 mb-4"></i>
                <h2 class="text-2xl font-bold text-gray-700 mb-2">Your cart is empty</h2>
                <p class="text-gray-500 mb-6">Add some products to get started</p>
                <a href="index.html#products" class="inline-block bg-gray-900 text-white px-8 py-3 rounded-full font-semibold hover:bg-black">Continue Shopping</a>
            </div>

            <div id="cart-content" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 space-y-4" id="cart-items"></div>
                <div class="bg-white rounded-2xl p-6 h-fit shadow-sm">
                    <h2 class="text-xl font-bold text-gray-900 mb-6">Order Summary</h2>
                    <div class="space-y-3 mb-6">
                        <div class="flex justify-between text-gray-600"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
                        <div class="flex justify-between text-gray-600"><span>Shipping</span><span class="text-green-600">Calculated at checkout</span></div>
                        <div class="border-t pt-3 flex justify-between text-lg font-bold text-gray-900"><span>Total</span><span id="total">$0.00</span></div>
                    </div>
                    <a href="checkout.html" class="block w-full bg-gold text-white text-center py-4 rounded-xl font-semibold hover:bg-yellow-600 transition mb-3">Proceed to Checkout</a>
                    <a href="index.html#products" class="block w-full text-center text-gray-600 py-2 hover:text-gold">Continue Shopping</a>

                    <div class="mt-6 pt-6 border-t">
                        <p class="text-xs text-gray-500 text-center mb-3">Secure payment via</p>
                        <div class="flex justify-center gap-3 text-2xl text-gray-400">
                            <i class="fab fa-cc-paypal"></i>
                            <i class="fab fa-cc-visa"></i>
                            <i class="fab fa-cc-mastercard"></i>
                            <i class="fab fa-cc-amex"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function renderCart() {
            const cart = Cart.get();
            const itemsEl = document.getElementById('cart-items');
            const emptyEl = document.getElementById('cart-empty');
            const contentEl = document.getElementById('cart-content');

            if (cart.length === 0) {
                emptyEl.classList.remove('hidden');
                contentEl.classList.add('hidden');
                return;
            }
            emptyEl.classList.add('hidden');
            contentEl.classList.remove('hidden');

            itemsEl.innerHTML = cart.map((item, i) => {
                const p = PRODUCTS.find(x => x.id === item.productId);
                if (!p) return '';
                const variantText = Object.entries(item.variant).map(([k, v]) => `${k}: ${v}`).join(' • ');
                return `
                    <div class="bg-white rounded-2xl p-4 flex gap-4 shadow-sm">
                        <img src="${p.image}" alt="${p.short}" class="w-24 h-24 object-cover rounded-xl">
                        <div class="flex-1">
                            <a href="product.html?id=${p.id}" class="font-semibold text-gray-900 hover:text-gold line-clamp-2 text-sm">${p.title}</a>
                            <p class="text-xs text-gray-500 mt-1">${variantText}</p>
                            <p class="text-gold font-bold mt-2">$${p.price.toFixed(2)}</p>
                        </div>
                        <div class="flex flex-col items-end justify-between">
                            <button onclick="removeItem(${i})" class="text-gray-400 hover:text-red-500"><i class="fas fa-trash"></i></button>
                            <div class="flex items-center gap-2">
                                <button onclick="updateQty(${i}, ${item.qty - 1})" class="w-8 h-8 border rounded">-</button>
                                <span class="w-8 text-center">${item.qty}</span>
                                <button onclick="updateQty(${i}, ${item.qty + 1})" class="w-8 h-8 border rounded">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            const total = Cart.getTotal();
            document.getElementById('subtotal').textContent = '$' + total.toFixed(2);
            document.getElementById('total').textContent = '$' + total.toFixed(2);
        }

        function removeItem(i) {
            Cart.remove(i);
            renderCart();
        }
        function updateQty(i, qty) {
            Cart.updateQty(i, qty);
            renderCart();
        }

        document.addEventListener('DOMContentLoaded', () => {
            Cart.updateBadge();
            Auth.updateUI();
            renderCart();
        });
    </script>
</body>
</html>
